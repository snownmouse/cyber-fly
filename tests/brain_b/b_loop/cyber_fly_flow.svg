<svg width="100%" viewBox="0 0 680 430" role="img">
  <title>果蝇脑 cyber_fly 云端连接组闭环流程图</title>
  <desc>感知(ESP32传感器) 经手机热点UDP上行到云端连接组大脑，大脑计算后下行行为指令回ESP32执行，同时看板与诊断观测；真实环境反馈形成闭环。参考 Nature 2024 FlyWire 连接组与 Shiu/Sterne 计算模型。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="340" y="34" text-anchor="middle" style="font-family:sans-serif;font-size:15px;font-weight:500;fill:#0C447C">果蝇脑 · 云端连接组闭环（cyber_fly）</text>
  <text x="340" y="58" text-anchor="middle" style="font-family:sans-serif;font-size:13px;fill:#5F5E5A">感知 → 上行 → 中枢计算 → 下行 → 执行（观测）</text>

  <g>
    <rect x="36" y="130" width="104" height="100" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="88" y="158" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:14px;font-weight:500;fill:#0C447C">感知</text>
    <text x="88" y="184" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:12px;fill:#185FA5">麦克风·听觉</text>
    <text x="88" y="208" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:12px;fill:#185FA5">IMU·前庭</text>
  </g>

  <g>
    <rect x="160" y="130" width="104" height="100" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
    <text x="212" y="158" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:14px;font-weight:500;fill:#444441">上行</text>
    <text x="212" y="184" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:12px;fill:#5F5E5A">热点 UDP</text>
    <text x="212" y="208" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:12px;fill:#5F5E5A">relay 中转</text>
  </g>

  <g>
    <rect x="284" y="130" width="104" height="100" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="336" y="152" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:14px;font-weight:500;fill:#3C3489">中枢</text>
    <text x="336" y="176" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:12px;fill:#534AB7">连接组脑</text>
    <text x="336" y="198" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:12px;fill:#534AB7">38组·9区</text>
    <text x="336" y="220" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:12px;fill:#534AB7">stage1_loop</text>
  </g>

  <g>
    <rect x="408" y="130" width="104" height="100" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
    <text x="460" y="158" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:14px;font-weight:500;fill:#444441">下行</text>
    <text x="460" y="184" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:12px;fill:#5F5E5A">行为指令</text>
    <text x="460" y="208" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:12px;fill:#5F5E5A">relay 回传</text>
  </g>

  <g>
    <rect x="532" y="130" width="104" height="100" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="584" y="152" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:14px;font-weight:500;fill:#0C447C">执行·观测</text>
    <text x="584" y="176" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:12px;fill:#185FA5">电机振翅</text>
    <text x="584" y="198" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:12px;fill:#185FA5">看板诊断</text>
    <text x="584" y="220" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:12px;fill:#185FA5">ESP32↔云</text>
  </g>

  <line x1="142" y1="180" x2="156" y2="180" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="266" y1="180" x2="280" y2="180" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="180" x2="404" y2="180" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="514" y1="180" x2="528" y2="180" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M 540 232 C 568 314, 112 314, 140 232" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="340" y="302" text-anchor="middle" style="font-family:sans-serif;font-size:12px;fill:#5F5E5A">真实环境变化 → 再感知（闭环）</text>

  <text x="40" y="340" style="font-family:sans-serif;font-size:12px;fill:#5F5E5A">生物对应：</text>
  <g>
    <rect x="40" y="348" width="150" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="115" y="366" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:12px;fill:#185FA5">麦克风 + IMU</text>
    <text x="115" y="384" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:12px;fill:#185FA5">= 感觉器官</text>
  </g>
  <g>
    <rect x="190" y="348" width="150" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="265" y="366" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:12px;fill:#185FA5">ESP32</text>
    <text x="265" y="384" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:12px;fill:#185FA5">= 脑干 / 脊髓</text>
  </g>
  <g>
    <rect x="340" y="348" width="150" height="46" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="415" y="366" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:12px;fill:#534AB7">云端连接组</text>
    <text x="415" y="384" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:12px;fill:#534AB7">= 大脑</text>
  </g>
  <g>
    <rect x="490" y="348" width="150" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="565" y="366" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:12px;fill:#185FA5">电机 / 振翅</text>
    <text x="565" y="384" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:12px;fill:#185FA5">= 运动神经</text>
  </g>

  <text x="340" y="416" text-anchor="middle" style="font-family:sans-serif;font-size:12px;fill:#5F5E5A">参考 Nature 2024 · FlyWire 完整连接组(~14万神经元/5450万突触) + Shiu&amp;Sterne 计算模型(Nature 634:210)</text>
</svg>
